  - id: LNK-001
    kind: constraint
    behavior: Linked artifacts are off by default, exist only on the local deployment behind capability discovery, reference the file in place, and are created only by an explicit protocol call naming the path.
    owner: local-workspace
    source: {file: local-workspace-spec.md, anchor: conformance-requirements-to-add}
    acceptance:
      behavior: {id: LNK-001-B, description: "Enable linked artifacts on a local deployment, observe the advertised capability, link a file through the MCP tool and the HTTP endpoint, and verify the file stays at its original path and is never copied, moved, watched, or scanned into an artifact without that explicit call."}
      failure: {id: LNK-001-F, description: "With the feature off or on any non-local deployment, the capability is absent, every linked-artifact route answers the stable capability-unavailable shape, and enabling the flag outside the local runtime fails startup; no file on disk becomes an artifact without an explicit link call."}
    deployments: *all
    status: implementing
    proof_gap: The acceptance-ID tests prove the off-by-default 501 shape, capability discovery, reference-in-place linking over MCP and HTTP, and the absence of scanning on the local deployment, and a worker runtime test proves the Cloudflare absence; the single-server, kubernetes, aws, and gcp deployment suites do not yet assert the absence shape, and no recorded run is attached to these IDs yet.
    depends_on: [ART-001, VER-001]
    evidence: []

  - id: LNK-007
    kind: security
    behavior: The live view streams the source's current disk bytes with no-store caching only to admitted members authenticated on the local deployment over the artifact's live origin; every other reader receives only captured immutable versions.
    owner: local-workspace
    source: {file: local-workspace-spec.md, anchor: conformance-requirements-to-add}
    acceptance:
      behavior: {id: LNK-007-B, description: "As an admitted local member, read a linked artifact's live view, edit the file on disk, re-read, and observe the current bytes with no-store caching while captured-version routes keep immutable caching."}
      failure: {id: LNK-007-F, description: "Public-link possession, anonymous requests, non-member sessions, content-origin version routes, and every non-local deployment never receive a live disk byte, and a missing or unreadable source degrades the live view to the last captured version without an error."}
    deployments: *all
    status: implementing
    proof_gap: The acceptance-ID tests prove no-store live delivery to an admitted local member, the 401 for anonymous and version-cookie callers, the captured-only public path under drift, and the degrade-to-captured behavior, and a worker runtime test proves the Cloudflare absence; the single-server, kubernetes, aws, and gcp deployment suites do not yet assert the absence, and no recorded run is attached to these IDs yet.
    depends_on: [LNK-001, AUTH-008]
    evidence: []

  - id: LNK-008
    kind: behavior
    behavior: A comment thread on a linked artifact anchors to a captured version, and creating one on a drifted binding implicitly captures first, attributed to the commenting principal, in the same request.
    owner: local-workspace
    source: {file: local-workspace-spec.md, anchor: conformance-requirements-to-add}
    acceptance:
      behavior: {id: LNK-008-B, description: "Comment on an in-sync linked artifact and observe the thread on the current version with no new version; drift the file, comment again, and observe one implicit capture attributed to the commenter with the thread anchored to the new version."}
      failure: {id: LNK-008-F, description: "An implicit capture aborted by a drift race fails the whole comment request with the retryable drift error and creates no thread, and no thread ever anchors to live bytes or to a version that was not durably captured."}
    deployments: [local]
    status: implementing
    proof_gap: The acceptance-ID tests prove the in-sync anchor, the implicit capture attributed to the commenting principal, and that an aborted implicit capture creates no thread and no version; the abort is forced through the action ledger rather than a genuine mid-read drift race, so the retryable drift error on that race is unproved, and no recorded run is attached to these IDs yet.
    depends_on: [LNK-004, CMT-001]
    evidence: []

  - id: LNK-002
    kind: behavior
    behavior: Linking a file creates an ordinary artifact with an initial captured version through the normal publish pipeline, so a linked artifact is never versionless.
    owner: local-workspace
    source: {file: local-workspace-spec.md, anchor: conformance-requirements-to-add}
    acceptance:
      behavior: {id: LNK-002-B, description: "Link one regular file and receive an artifact whose first version carries the file's verified bytes, canonical manifest, action record, and idempotency result."}
      failure: {id: LNK-002-F, description: "Linking a directory, symlink, special file, missing path, or unreadable file creates no artifact and no version; replaying the same link idempotency key returns the original artifact."}
    deployments: [local]
    status: implementing
    proof_gap: The acceptance-ID tests drive the HTTP link route and prove the first captured version, its canonical manifest, the link action record, the refusals for a directory, symlink, socket, missing, and unreadable path, and idempotent replay; the MCP and CLI link surfaces are not exercised by these IDs, and no recorded run is attached to them yet.
    depends_on: [LNK-001, PUB-001]
    evidence: []

  - id: LNK-003
    kind: behavior
    behavior: External modification, removal, and unreadability of a linked source surface as binding freshness on metadata reads without creating, changing, or deleting any version.
    owner: local-workspace
    source: {file: local-workspace-spec.md, anchor: conformance-requirements-to-add}
    acceptance:
      behavior: {id: LNK-003-B, description: "Modify, remove, and restore the source file and observe the binding freshness move through modified, missing, and back while the version list and delivered bytes stay identical."}
      failure: {id: LNK-003-F, description: "A freshness refresh cannot write a version, an action record, or any artifact mutation, and a failed stat degrades only the freshness field, never the read."}
    deployments: [local]
    status: implementing
    proof_gap: The acceptance-ID tests observe freshness through the authenticated artifact read while the database refuses every version and action write, and they cover modification, replacement, removal, restoration, and a failed stat; freshness reported through the MCP read surface is not exercised by these IDs, and no recorded run is attached to them yet.
    depends_on: [LNK-001]
    evidence: []

  - id: LNK-004
    kind: behavior
    behavior: Capture publishes the source's current bytes as a new immutable version using descriptor-verified fingerprint checks, an idempotency key, and the publish current-version conflict behavior.
    owner: local-workspace
    source: {file: local-workspace-spec.md, anchor: conformance-requirements-to-add}
    acceptance:
      behavior: {id: LNK-004-B, description: "Modify the source, capture, and receive a new version whose bytes hash-match the file read from one verified descriptor; capturing an in-sync binding replays the current version without a new one."}
      failure: {id: LNK-004-F, description: "A file that changes between fingerprint checks aborts the capture with a retryable drift error and no version, and a stale expected current version returns the publish conflict shape with the actual current version."}
    deployments: [local]
    status: implementing
    proof_gap: The acceptance-ID tests prove that captured bytes hash-match the file on disk, that an in-sync capture replays the current version under a fresh key, and that a stale expected current version returns the publish conflict naming the actual current version with no version written; a file that changes between the two fingerprint checks cannot be forced deterministically through the HTTP boundary, so the retryable drift abort is unproved, and no recorded run is attached to these IDs yet.
    depends_on: [LNK-002, PUB-006]
    evidence: []

  - id: LNK-005
    kind: behavior
    behavior: Relink re-points a binding at a moved file under an expected content hash while preserving the artifact identity, versions, comments, and attachments.
    owner: local-workspace
    source: {file: local-workspace-spec.md, anchor: conformance-requirements-to-add}
    acceptance:
      behavior: {id: LNK-005-B, description: "Move the source file, relink with the expected hash, and observe the same artifact ID, version list, and comment threads with a healthy binding at the new path."}
      failure: {id: LNK-005-F, description: "A relink whose target bytes do not match the expected hash is rejected and changes nothing, and a relink to a path outside the link roots or inside the data directory is refused."}
    deployments: [local]
    status: implementing
    proof_gap: The acceptance-ID tests prove a moved file relinks under its expected hash with the same artifact ID, version list, and comment threads, and that a mismatched hash, a path outside every root, and a path inside the data directory each change nothing; artifact attachments are not exercised by these IDs, and no recorded run is attached to them yet.
    depends_on: [LNK-002]
    evidence: []

  - id: LNK-006
    kind: security
    behavior: Link paths are canonicalized, restricted to configured link roots, denied for the server's own data and database files, accepted only from authorized principals over the loopback application origin, and never select storage or appear in public or content-origin responses.
    owner: local-workspace
    source: {file: local-workspace-spec.md, anchor: conformance-requirements-to-add}
    acceptance:
      behavior: {id: LNK-006-B, description: "Link inside a configured root as an admitted member over loopback and read the binding path back only through authenticated application-origin metadata."}
      failure: {id: LNK-006-F, description: "Paths outside every root, the data directory, database files, symlink escapes, anonymous or public-link callers, and non-loopback origins are all refused; no public, content-origin, or log surface reveals a source path, and no request path ever resolves against the linked filesystem."}
    deployments: [local]
    status: implementing
    proof_gap: The acceptance-ID tests prove root containment, dot-dot and symlink escape refusals, data-directory and database self-protection, anonymous and non-loopback refusals, path non-disclosure on every refusal body, and manifest-only delivery; no recorded run is attached to these IDs yet.
    depends_on: [LNK-001, AUTH-008]
    evidence: []

  - id: KAN-001
    kind: behavior
    behavior: Each project has exactly one Kanban board with the four fixed columns, created on first use.
    owner: kanban
    source: {file: local-workspace-spec.md, anchor: conformance-requirements-to-add}
    acceptance:
      behavior: {id: KAN-001-B, description: "Read a fresh project's board and receive the four fixed columns empty; the same board answers every subsequent read."}
      failure: {id: KAN-001-F, description: "A card naming an unknown column is rejected, and no operation can create a second board or a new column."}
    deployments: *all
    status: specified
    depends_on: [PRJ-002]
    evidence: []

  - id: KAN-002
    kind: behavior
    behavior: Cards enforce the documented bounds on title, description, labels, assignee, paused placement, and attachments.
    owner: kanban
    source: {file: local-workspace-spec.md, anchor: conformance-requirements-to-add}
    acceptance:
      behavior: {id: KAN-002-B, description: "Create and edit cards at every documented bound and read each stored field back unchanged."}
      failure: {id: KAN-002-F, description: "An oversize title or description, a ninth label, a duplicate case-folded label, paused outside in-progress, and a fifty-first attachment are each rejected without a partial write."}
    deployments: *all
    status: specified
    depends_on: [KAN-001]
    evidence: []

  - id: KAN-003
    kind: behavior
    behavior: Card mutations use per-card revisions so edits to different cards merge while same-card edits conflict and return the current card.
    owner: kanban
    source: {file: local-workspace-spec.md, anchor: conformance-requirements-to-add}
    acceptance:
      behavior: {id: KAN-003-B, description: "Edit two different cards from two clients concurrently and observe both succeed; edit one card twice from the same revision and observe the second receive a conflict carrying the current card."}
      failure: {id: KAN-003-F, description: "A mutation without the expected revision or with a stale revision cannot change the card, and a conflicting update leaves exactly one winner recorded."}
    deployments: *all
    status: specified
    depends_on: [KAN-001]
    evidence: []

  - id: KAN-004
    kind: behavior
    behavior: Card ordering is server-assigned dense positions per column, and a move names the target column and an optional before-card.
    owner: kanban
    source: {file: local-workspace-spec.md, anchor: conformance-requirements-to-add}
    acceptance:
      behavior: {id: KAN-004-B, description: "Move cards within and across columns using before-card targets and read back dense, unique positions in every column."}
      failure: {id: KAN-004-F, description: "A move naming a before-card in a different column or an unknown card is rejected, and concurrent moves never leave duplicate or gapped positions."}
    deployments: *all
    status: specified
    depends_on: [KAN-001]
    evidence: []

  - id: KAN-005
    kind: behavior
    behavior: Card attachments reference same-project artifacts by ID and survive artifact deletion as explicit missing attachments.
    owner: kanban
    source: {file: local-workspace-spec.md, anchor: conformance-requirements-to-add}
    acceptance:
      behavior: {id: KAN-005-B, description: "Attach artifacts to a card, delete one artifact, and read the card back valid with that attachment marked unavailable."}
      failure: {id: KAN-005-F, description: "Attaching an artifact from another project or installation is rejected as not found, and deleting a card never deletes or alters an artifact."}
    deployments: *all
    status: specified
    depends_on: [KAN-001, ART-004]
    evidence: []

  - id: KAN-006
    kind: security
    behavior: Board reads require artifact-read authority, mutations require an admitted human member or a service key holding the board-write capability, and every operation is project-scoped and action-recorded.
    owner: kanban
