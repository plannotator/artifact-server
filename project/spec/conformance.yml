      failure: {id: EDT-001-F, description: "An edit naming a path absent from the base manifest, a missing upload, or an aborted transaction creates no version, and no stored version's bytes ever change."}
    deployments: *all
    status: specified
    depends_on: [PUB-001, PUB-006, VER-001]
    evidence: []

