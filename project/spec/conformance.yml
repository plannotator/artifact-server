  - id: EDT-001
    kind: behavior
    behavior: An edit commit publishes a new immutable version that copies the base version's manifest with exactly one text entry replaced by verified uploaded bytes, with an idempotency key, current-version compare-and-swap, and an action record marked as an edit.
    owner: publishing
    source: {file: local-workspace-spec.md, anchor: conformance-requirements-to-add}
    acceptance:
