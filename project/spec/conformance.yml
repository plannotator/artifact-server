  - id: AUTH-022
    kind: constraint
    behavior: In-process authentication caching is a bounded-staleness optimization only; successful session and managed-key checks may be cached for at most 30 seconds in a bounded store, entries never outlive the credential's own expiry, failures are never cached, and same-process logout, key revocation, key rotation, and member deactivation evict immediately, so a credential revoked on another replica authenticates for at most 30 more seconds.
    owner: authorization
    source: {file: decisions/0004-installation-identity-and-login.md, anchor: consequences}
    acceptance:
      behavior: {id: AUTH-022-B, description: "Warm a session check, revoke the session directly in shared storage as another replica would, observe the warmed check keep succeeding inside the 30-second bound, observe refusal once the bound passes, and observe same-process logout refuse immediately without waiting out the bound."}
      failure: {id: AUTH-022-F, description: "A warmed session check cannot outlive the session's absolute expiry inside the cache window, and a session refused by storage is not cached and stays refused."}
    deployments: *all
    status: behavior_verified
    depends_on: [AUTH-008]
    evidence:
      - deployment: local
        tests: [AUTH-022-B, AUTH-022-F]
        result: pass
