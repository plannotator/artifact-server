version: 1
product: Artifact Server
updated: "2026-08-25"
evidence_root: "../.."

source:
  product_spec: artifact-server-product-spec.html
  supporting_spec: artifact-server-product-spec.md
  administration_spec: single-application-administration-spec.md
  mcp_spec: artifact-server-mcp-baseline.md
  plannotator_spec: plannotator-artifact-server-integration-spec.md

# A deployment can be advertised as supported only when every requirement that
# names that deployment is verified with evidence from that deployment.
deployment_sets:
  all: &all
    [local, single_server, kubernetes, cloudflare, aws, gcp]
  external_storage: &external_storage
    [single_server, kubernetes, cloudflare, aws, gcp]
  replicated: &replicated
    [kubernetes, cloudflare, aws, gcp]
  hosted: &hosted
    [cloudflare]
  direct_clouds: &direct_clouds
    [aws, gcp]
  plannotator_capable: &plannotator_capable
    [single_server, kubernetes, cloudflare, aws, gcp]

allowed_statuses:
  - specified
  - implementing
  - behavior_verified
  - verified
  - blocked
  - not_applicable

status_contract:
  specified: The behavior and tests are defined, but no implementation proof is claimed.
  implementing: Implementation work has started, but proof is incomplete.
  behavior_verified: At least one applicable deployment has passing behavior-test evidence, but full proof is incomplete.
  verified: Every applicable deployment has passing behavior and failure-test evidence.
  blocked: Work cannot proceed until the recorded blocker is resolved.
  not_applicable: The requirement was retained for traceability but has a recorded reason it does not apply.

evidence_contract:
  required_fields: [deployment, tests, result, run, recorded_at]
  allowed_results: [pass, fail]
  note: A verified requirement must cover its behavior and failure test on every applicable deployment with passing evidence.

allowed_kinds:
  - behavior
  - constraint
  - security
  - deployment
  - release_gate
  - exclusion

allowed_modules:
  - product-core
  - project-core
  - artifact-core
  - manifest
  - publishing
  - blob-storage
  - content-delivery
  - authorization
  - comparison
  - git-history
  - web-application
  - http-api
  - mcp
  - cli
  - agent-skills
  - artifact-comments
  - agent-dispatch
  - agent-bridge
  - agent-presence
  - local-workspace
  - kanban
  - plannotator-integration
  - database-adapters
  - deployment
  - operations
  - hosted-policy

required_source_sections:
  top: [PRD-001, PRD-002]
  product: [PRD-003]
  artifact: [PRJ-001, PRJ-002, PRJ-003, PRJ-004, ART-001, ART-002, ART-003, ART-004, ART-005, ART-008]
  experience: [CNT-001, CNT-002, VER-001, DIF-001, GIT-001]
  sharing: [AUTH-001, AUTH-002, AUTH-003, AUTH-004, AUTH-018]
  plannotator: [PLN-001, PLN-002, PLN-003, PLN-004, PLN-005, PLN-017]
  architecture: [ARC-001, ARC-002, ARC-006, PUB-001, CNT-003]
  mcp: [MCP-001, MCP-002, CLI-001, SKL-001]
  deployment: [DEP-001, DEP-002, DEP-003, DEP-004]
  safety: [SEC-001, SEC-002, SEC-003, SEC-004]
  scope: [SCP-001, SCP-002, SCP-003]
  implementation: [REL-001, REL-002, REL-003, REL-004]
  decisions: [GATE-001, GATE-002, GATE-003]

requirements:
  - id: PRD-001
    kind: behavior
    behavior: Artifact Server stores and serves finished client-side sites and arbitrary individual files.
    owner: product-core
    source: {file: artifact-server-product-spec.html, anchor: top}
    acceptance:
      behavior: {id: PRD-001-B, description: "Publish and open both a complete client-side site and one ordinary file."}
      failure: {id: PRD-001-F, description: "Reject input that is neither a valid file nor a valid finished client-side directory without creating an artifact."}
    deployments: *all
    status: specified
    depends_on: []
    evidence: []

  - id: PRD-002
    kind: exclusion
    behavior: Artifact Server does not build source code, install packages, run an artifact backend, perform server-side rendering, or convert uploaded media.
    owner: product-core
    source: {file: artifact-server-product-spec.html, anchor: top}
    acceptance:
      behavior: {id: PRD-002-B, description: "Serve already-finished files without starting an artifact-specific runtime or conversion job."}
      failure: {id: PRD-002-F, description: "Publishing source that requires Node.js, Python, a database, a server function, or a conversion step does not cause the server to execute it."}
    deployments: *all
    status: specified
    depends_on: []
    evidence: []

  - id: PRD-003
    kind: behavior
    behavior: The normal workflow publishes, opens, compares, and shares a project artifact without creating a separate hosting deployment for that artifact.
    owner: product-core
    source: {file: artifact-server-product-spec.html, anchor: product}
    acceptance:
      behavior: {id: PRD-003-B, description: "Complete publish, open, compare, and visibility operations against one stable artifact identity."}
      failure: {id: PRD-003-F, description: "Repeating the workflow does not create an unrelated deployment, project, or artifact identity."}
    deployments: *all
    status: specified
    depends_on: [ART-001, VER-001, DIF-001]
    evidence: []

  - id: PRJ-001
    kind: behavior
    behavior: One installation represents one person, team, or company and contains projects; a new installation creates one default project without adding an organization switcher or Artifact Store object.
    owner: project-core
    source: {file: artifact-server-product-spec.html, anchor: artifact}
    acceptance:
      behavior: {id: PRJ-001-B, description: "Start a new local and team installation, observe one stable default project, create another project, and list both within the same installation."}
      failure: {id: PRJ-001-F, description: "A caller cannot create or select an organization, Artifact Store, Namespace, or project belonging to another installation."}
    deployments: *all
    status: implementing
    proof_gap: The current local test proves one default project, creation of a second project, and foreign-project rejection, but it does not start a team deployment or probe organization, Artifact Store, and Namespace creation and selection surfaces.
    depends_on: [AUTH-001]
    evidence: []

  - id: PRJ-002
    kind: security
    behavior: Every artifact belongs to exactly one project, and project scope is enforced by repositories, uploads, idempotency, browser sessions, HTTP, MCP, audit, backup, and restore.
    owner: project-core
    source: {file: artifact-server-product-spec.html, anchor: artifact}
    acceptance:
      behavior: {id: PRJ-002-B, description: "Publish, list, read, compare, restore, change, audit, back up, and restore artifacts inside their named projects through HTTP and MCP."}
      failure: {id: PRJ-002-F, description: "Cross-project and cross-installation artifact, version, upload, key, idempotency, content-session, list, search, audit, backup, and restore attempts fail without revealing which identifier exists."}
    deployments: *all
    status: implementing
    proof_gap: The current local test covers selected HTTP upload, list, read, comparison, mutation, and audit boundaries; it does not prove the complete HTTP and MCP matrix or the named key, idempotency, content-session, search, backup, and restore boundaries.
    depends_on: [PRJ-001, AUTH-008]
    evidence: []

  - id: PRJ-003
    kind: behavior
    behavior: Projects use installation membership and have no separate member list or access-control list; archiving stops new artifacts and versions while preserving existing reads and immutable history.
    owner: project-core
    source: {file: artifact-server-product-spec.html, anchor: artifact}
    acceptance:
      behavior: {id: PRJ-003-B, description: "Read account-required artifacts through installation membership, archive a project, retain existing reads and comparisons, and reject new artifacts and versions."}
      failure: {id: PRJ-003-F, description: "Project creation cannot add a hidden member list or ACL, and archive cannot delete, retarget, or alter an existing artifact, version, link, manifest, or action record."}
    deployments: *all
    status: implementing
    proof_gap: The archive test uses a public artifact and proves write rejection plus retained reads, but it does not prove installation-membership access, absence of a project ACL, retained comparisons, or unchanged links, manifests, and action records.
    depends_on: [PRJ-001, AUTH-001, VER-001]
    evidence: []

  - id: PRJ-004
    kind: release_gate
    behavior: Existing installations migrate every artifact into one default project without changing any existing identity, version bytes, link target, action record, or authorization outcome.
    owner: database-adapters
    source: {file: artifact-server-product-spec.html, anchor: artifact}
    acceptance:
      behavior: {id: PRJ-004-B, description: "Upgrade populated SQLite and Postgres installations and verify preserved installation, artifact, version, manifest, content, action, visibility, tag, and link values under the default project."}
      failure: {id: PRJ-004-F, description: "Interrupted, repeated, partially applied, and rolled-back migrations cannot duplicate projects, orphan artifacts, change IDs, lose bytes, or widen access."}
    deployments: *all
    status: implementing
    proof_gap: The acceptance-ID test exercises a populated SQLite migration and repeat startup only; the combined SQLite and Postgres preservation matrix plus interrupted, partially applied, and rolled-back migration proof is not attached to these IDs.
    depends_on: [PRJ-001, PRJ-002]
    evidence: []

  - id: PRD-004
    kind: constraint
    behavior: Browser, HTTP, MCP, CLI, and Plannotator entry points use the same product and authorization services.
    owner: product-core
    source: {file: artifact-server-product-spec.html, anchor: architecture}
    acceptance:
      behavior: {id: PRD-004-B, description: "Run the same publish and authorization conformance cases through browser, HTTP, and MCP entry points."}
      failure: {id: PRD-004-F, description: "An operation forbidden through one interface is not permitted through another interface."}
    deployments: *all
    status: specified
    depends_on: [AUTH-008, MCP-009]
    evidence: []

  - id: ART-001
    kind: behavior
    behavior: An artifact has one stable identity across every intentional publish.
    owner: artifact-core
    source: {file: artifact-server-product-spec.html, anchor: artifact}
    acceptance:
      behavior: {id: ART-001-B, description: "Publish two versions and confirm that the artifact ID remains stable while version IDs differ."}
      failure: {id: ART-001-F, description: "A new version cannot change or reuse another artifact's identity."}
    deployments: *all
    status: behavior_verified
    depends_on: []
    evidence:
      - deployment: local
        tests: [ART-001-B]
        result: pass
        run: project/evidence/local-foundation.json
        recorded_at: "2026-08-17T03:17:21.421Z"

  - id: ART-002
    kind: behavior
    behavior: An artifact records its project, name, access setting, current version, creation time, and deletion state.
    owner: artifact-core
    source: {file: artifact-server-product-spec.html, anchor: artifact}
    acceptance:
      behavior: {id: ART-002-B, description: "Create an artifact in a project and retrieve every required field with stable types and values."}
      failure: {id: ART-002-F, description: "Reject creation when required project or artifact data is missing or refers to another project or installation."}
    deployments: *all
    status: behavior_verified
    depends_on: [PRJ-002, ART-001]
    evidence:
      - deployment: local
        tests: [ART-002-B]
        result: pass
        run: project/evidence/local-foundation.json
        recorded_at: "2026-08-17T03:17:21.421Z"

  - id: ART-003
    kind: behavior
    behavior: A saved version records a unique ID, artifact ID, number, canonical manifest digest, entry file, routing mode, publisher, and creation time.
    owner: artifact-core
    source: {file: artifact-server-product-spec.html, anchor: artifact}
    acceptance:
      behavior: {id: ART-003-B, description: "Publish a version and retrieve all required version fields and their referenced artifact."}
      failure: {id: ART-003-F, description: "Reject a version whose artifact, manifest, entry file, publisher, or routing mode is invalid."}
    deployments: *all
    status: behavior_verified
    depends_on: [ART-001, MAN-001]
    evidence:
      - deployment: local
        tests: [ART-003-B]
        result: pass
        run: project/evidence/local-foundation.json
        recorded_at: "2026-08-17T03:17:21.421Z"

  - id: ART-004
    kind: behavior
    behavior: Every saved version is immutable after its database commit.
    owner: artifact-core
    source: {file: artifact-server-product-spec.html, anchor: artifact}
    acceptance:
      behavior: {id: ART-004-B, description: "Read a committed version repeatedly and confirm that its manifest and file fingerprints never change."}
      failure: {id: ART-004-F, description: "Reject attempts to edit a committed version or replace any referenced blob."}
    deployments: *all
    status: behavior_verified
    depends_on: [PUB-005]
    evidence:
      - deployment: local
        tests: [ART-004-B, ART-004-F]
        result: pass
        run: project/evidence/local-foundation.json
        recorded_at: "2026-08-17T03:17:21.421Z"

  - id: ART-005
    kind: behavior
    behavior: Restoring an earlier version changes only the artifact's current-version pointer and records the action.
    owner: artifact-core
    source: {file: artifact-server-product-spec.html, anchor: artifact}
    acceptance:
      behavior: {id: ART-005-B, description: "Restore an earlier version and confirm that existing version IDs, manifests, and files remain unchanged."}
      failure: {id: ART-005-F, description: "Reject restoring a version from another artifact or installation."}
    deployments: *all
    status: behavior_verified
    depends_on: [ART-004, AUD-001]
    evidence:
      - deployment: local
        tests: [ART-005-B, ART-005-F]
        result: pass
        run: project/evidence/local-foundation.json
        recorded_at: "2026-08-17T03:17:21.421Z"

  - id: ART-006
    kind: behavior
    behavior: Deleting an artifact creates a tombstone and stops every application and content link without deleting individual versions immediately.
    owner: artifact-core
    source: {file: artifact-server-product-spec.html, anchor: architecture}
    acceptance:
      behavior: {id: ART-006-B, description: "Delete an artifact and confirm that all stable and exact-version links stop serving while its tombstone remains."}
      failure: {id: ART-006-F, description: "A deleted artifact cannot be reopened through a cached application authorization or direct origin request."}
    deployments: *all
    status: behavior_verified
    depends_on: [ART-004, AUTH-017]
    evidence:
      - deployment: local
        tests: [ART-006-B, ART-006-F]
        result: pass
        run: project/evidence/local-foundation.json
        recorded_at: "2026-08-17T03:17:21.421Z"

  - id: ART-007
    kind: constraint
    behavior: Automatic version expiry and individual committed-version deletion are not supported in the initial product.
    owner: artifact-core
    source: {file: artifact-server-product-spec.html, anchor: decisions}
    acceptance:
      behavior: {id: ART-007-B, description: "Confirm that a committed version remains addressable until its artifact is tombstoned under explicit policy."}
      failure: {id: ART-007-F, description: "No API, UI, MCP tool, or cleanup worker can delete one committed version independently."}
    deployments: *all
    status: behavior_verified
    depends_on: [ART-004]
    evidence:
      - deployment: local
        tests: [ART-007-B]
        result: pass
        run: project/evidence/local-foundation.json
        recorded_at: "2026-08-17T03:17:21.421Z"

  - id: ART-008
    kind: behavior
    behavior: An artifact has zero to 20 normalized, unique tags. Tags belong to the artifact rather than one version, remain through publish, restore, and tombstone operations, and support exact normalized filtering.
    owner: artifact-core
    source: {file: artifact-server-product-spec.html, anchor: artifact}
    acceptance:
      behavior: {id: ART-008-B, description: "Create tags through inline and staged publication, replace them atomically, filter by an exact normalized tag, and confirm they remain through publish, restore, and tombstone operations."}
      failure: {id: ART-008-F, description: "Reject empty, overlong, control-character, and oversized tag sets plus conflicting retries without changing stored tags or action history."}
    deployments: *all
    status: behavior_verified
    depends_on: [ART-001, ART-005, ART-006, AUD-001]
    evidence:
      - deployment: local
        tests: [ART-008-B, ART-008-F]
        result: pass
        run: project/evidence/local-foundation.json
        recorded_at: "2026-08-17T03:17:21.421Z"

  - id: ART-009
    kind: behavior
    behavior: Project artifact search runs before pagination and returns artifacts whose normalized name contains the normalized search text or whose tags contain that exact normalized text, while a Review keeps its exact selected preview when it is outside the result set.
    owner: artifact-core
    source: {file: artifact-server-product-spec.html, anchor: artifact}
    acceptance:
      behavior: {id: ART-009-B, description: "Search a project by case- and whitespace-normalized artifact-name substring and exact normalized tag, including an artifact absent from the loaded catalog page, while the selected Review preview remains unchanged."}
      failure: {id: ART-009-F, description: "A partial tag, another project, or a nonmatching name is not returned, and an empty result cannot replace the selected Review artifact or version."}
    deployments: *all
    status: behavior_verified
    proof_gap: Local HTTP and browser evidence proves project-wide search and preview preservation. Equivalent evidence for each team deployment remains unrecorded.
    depends_on: [ART-002, ART-008, PRJ-002]
    evidence:
      - deployment: local
        tests: [ART-009-B, ART-009-F]
        result: pass
        run: project/evidence/local-foundation.json
        recorded_at: "2026-08-25T19:14:39.424Z"
      - deployment: local
        tests: [ART-009-B, ART-009-F]
        result: pass
        run: project/evidence/browser.json
        recorded_at: "2026-08-25T19:16:53.330Z"

  - id: ART-010
    kind: behavior
    behavior: Review offers a confirmed Make current action for a historical version, submits the expected current-version ID, reports conflicts without moving the pointer, and keeps the reviewer on the exact selected version after success or conflict.
    owner: artifact-core
    source: {file: artifact-server-product-spec.html, anchor: artifact}
    acceptance:
      behavior: {id: ART-010-B, description: "Confirm Make current for a historical version, observe only the current pointer move, and remain on the exact historical Review URL and preview."}
      failure: {id: ART-010-F, description: "Publish concurrently after confirmation opens; Make current fails with a conflict, refreshes pointer state, and neither changes the concurrent current version nor navigates the reviewer."}
    deployments: *all
    status: behavior_verified
    proof_gap: Local browser evidence proves conflict-safe Make current behavior and exact Review preservation. Equivalent evidence for each team deployment remains unrecorded.
    depends_on: [ART-004, ART-005, CMT-016]
    evidence:
      - deployment: local
        tests: [ART-010-B, ART-010-F]
        result: pass
        run: project/evidence/browser.json
        recorded_at: "2026-08-25T19:16:53.330Z"

  - id: MAN-001
    kind: behavior
    behavior: A canonical manifest contains a sorted list of normalized paths, fingerprints, sizes, media types, disposition, entry file, routing mode, and serving metadata.
    owner: manifest
    source: {file: artifact-server-product-spec.html, anchor: artifact}
    acceptance:
      behavior: {id: MAN-001-B, description: "Build the same manifest from equivalent directory walks and obtain identical canonical bytes and digest."}
      failure: {id: MAN-001-F, description: "Reject a manifest with duplicate paths, missing fields, nondeterministic ordering, or an absent entry file."}
    deployments: *all
    status: implementing
    proof_gap: The current test compares manifest digests and path ordering, but it does not compare canonical manifest bytes or cover every missing-field and nondeterministic-ordering failure named by the acceptance tests.
    depends_on: []
    evidence: []

  - id: MAN-002
    kind: behavior
    behavior: Each file entry records normalized path, byte length, media type, SHA-256 fingerprint, and file disposition.
    owner: manifest
    source: {file: artifact-server-product-spec.html, anchor: artifact}
    acceptance:
      behavior: {id: MAN-002-B, description: "Publish representative files and confirm each manifest entry matches the exact stored bytes and serving metadata."}
      failure: {id: MAN-002-F, description: "Reject a claimed size or fingerprint that differs from the uploaded bytes."}
    deployments: *all
    status: implementing
    proof_gap: The complete-site test confirms stored bytes and selected response headers, but it does not inspect every committed manifest-entry field; the size and fingerprint rejection path is proved under PUB-003 rather than MAN-002-F.
    depends_on: [MAN-001]
    evidence: []

  - id: MAN-003
    kind: security
    behavior: Manifest paths are normalized, relative POSIX paths.
    owner: manifest
    source: {file: artifact-server-product-spec.html, anchor: artifact}
    acceptance:
      behavior: {id: MAN-003-B, description: "Publish nested portable paths and serve every file only at its normalized manifest location."}
      failure: {id: MAN-003-F, description: "Reject absolute paths, dot segments, empty segments, backslashes, NUL bytes, .git components, reserved .artifactserver metadata components, and encoded separators."}
    deployments: *all
    status: behavior_verified
    depends_on: []
    evidence:
      - deployment: local
        tests: [MAN-003-B, MAN-003-F]
        result: pass
        run: project/evidence/local-foundation.json
        recorded_at: "2026-08-17T03:17:21.421Z"

  - id: MAN-004
    kind: security
    behavior: Publishing rejects symlinks, devices, sockets, and other special filesystem entries.
    owner: manifest
    source: {file: artifact-server-product-spec.html, anchor: artifact}
    acceptance:
      behavior: {id: MAN-004-B, description: "Publish a directory containing only regular files and directories."}
      failure: {id: MAN-004-F, description: "Attempt every supported special-file type and confirm that the publish fails before a version is committed."}
    deployments: *all
    status: specified
    depends_on: [MAN-003]
    evidence: []

  - id: MAN-005
    kind: security
    behavior: Publishing rejects path collisions after case folding or Unicode normalization.
    owner: manifest
    source: {file: artifact-server-product-spec.html, anchor: artifact}
    acceptance:
      behavior: {id: MAN-005-B, description: "Publish distinct normalized names that remain distinct on every supported storage system."}
      failure: {id: MAN-005-F, description: "Reject case-only and normalization-equivalent path pairs before storing the version."}
    deployments: *all
    status: implementing
    proof_gap: MAN-005-F proves local rejection of case-only and normalization-equivalent collisions, but no behavior test publishes distinct normalized names across every supported storage system.
    depends_on: [MAN-003]
    evidence:
      - deployment: local
        tests: [MAN-005-F]
        result: pass
        run: project/evidence/local-foundation.json
        recorded_at: "2026-08-17T03:17:21.421Z"

  - id: MAN-006
    kind: security
    behavior: Content requests resolve only through the committed manifest and never by joining an untrusted path to a storage directory.
    owner: manifest
    source: {file: artifact-server-product-spec.html, anchor: safety}
    acceptance:
      behavior: {id: MAN-006-B, description: "Serve every committed file through its manifest entry."}
      failure: {id: MAN-006-F, description: "Traversal, alternate encoding, storage-key, and unlisted-file requests never read bytes outside the manifest."}
    deployments: *all
    status: behavior_verified
    depends_on: [MAN-001, MAN-003]
    evidence:
      - deployment: local
        tests: [MAN-006-B]
        result: pass
        run: project/evidence/local-foundation.json
        recorded_at: "2026-08-17T03:17:21.421Z"

  - id: PUB-001
    kind: behavior
    behavior: Publishing starts with an expiring upload record and a unique staging location bound to the principal and installation.
    owner: publishing
    source: {file: artifact-server-product-spec.html, anchor: architecture}
    acceptance:
      behavior: {id: PUB-001-B, description: "Create an upload and verify its principal, installation, unique staging location, and expiration."}
      failure: {id: PUB-001-F, description: "Another principal or installation cannot read, append, commit, or renew the staged upload."}
    deployments: *all
    status: behavior_verified
    depends_on: [AUTH-008]
    evidence:
      - deployment: local
        tests: [PUB-001-B, PUB-001-F]
        result: pass
        run: project/evidence/local-foundation.json
        recorded_at: "2026-08-17T03:17:21.421Z"

  - id: PUB-002
    kind: behavior
    behavior: Public clients publish one actual file or finished directory through a file-upload transport. JSON and MCP schemas do not accept raw source strings or base64-wrapped file contents.
    owner: publishing
    source: {file: artifact-server-product-spec.html, anchor: architecture}
    acceptance:
      behavior: {id: PUB-002-B, description: "Publish one ordinary file and one large multi-file fixture through the advertised upload plan without asking the user for a manifest, fingerprint, upload ID, or size threshold."}
      failure: {id: PUB-002-F, description: "Reject raw source strings, base64-wrapped file contents, and oversized MCP payloads with instructions for the supported file-upload path."}
    deployments: *all
    status: behavior_verified
    depends_on: [PUB-001]
    evidence:
      - deployment: local
        tests: [PUB-002-B, PUB-002-F]
        result: pass
        run: project/evidence/local-foundation.json
        recorded_at: "2026-08-17T03:17:21.421Z"

  - id: PUB-003
    kind: security
    behavior: The server verifies every staged file's size and SHA-256 fingerprint before committing the version.
    owner: publishing
    source: {file: artifact-server-product-spec.html, anchor: architecture}
    acceptance:
      behavior: {id: PUB-003-B, description: "Commit correctly sized and hashed staged files and retrieve matching manifest entries."}
      failure: {id: PUB-003-F, description: "Reject missing, truncated, oversized, or hash-mismatched files without creating a version."}
    deployments: *all
    status: behavior_verified
    depends_on: [PUB-001, MAN-002]
    evidence:
      - deployment: local
        tests: [PUB-003-B, PUB-003-F]
        result: pass
        run: project/evidence/local-foundation.json
        recorded_at: "2026-08-17T03:17:21.421Z"

  - id: PUB-004
    kind: behavior
    behavior: Verified files become immutable content-addressed blobs written without overwriting an existing blob.
    owner: blob-storage
    source: {file: artifact-server-product-spec.html, anchor: architecture}
    acceptance:
      behavior: {id: PUB-004-B, description: "Publish identical file bytes from several versions and confirm that they resolve to the same immutable fingerprint object."}
