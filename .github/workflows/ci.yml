name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  portable:
    name: macOS
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.3

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify portable code paths
        run: pnpm check

  gates:
    name: Linux gates
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reclaim unused runner disk
        run: |
          df -h /
          sudo rm -rf -- \
            /opt/ghc \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/dotnet
          df -h /

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.3

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Enable the containerd image store
        run: |
          artifactserver_daemon_config=$(mktemp)
          if [[ -s /etc/docker/daemon.json ]]; then
            jq \
              '.features = ((.features // {}) + {"containerd-snapshotter": true})' \
              /etc/docker/daemon.json > "$artifactserver_daemon_config"
          else
            printf '%s\n' \
              '{"features":{"containerd-snapshotter":true}}' \
              > "$artifactserver_daemon_config"
          fi
          sudo install -d -m 0755 /etc/docker
          sudo install -m 0644 \
            "$artifactserver_daemon_config" \
            /etc/docker/daemon.json
          rm -f -- "$artifactserver_daemon_config"
          sudo systemctl restart docker
          docker info --format '{{json .DriverStatus}}' \
            | grep -F 'io.containerd.snapshotter.v1'

      - name: Prepare attestation-capable BuildKit
        run: |
          docker buildx create \
            --driver docker-container \
            --driver-opt image=moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8 \
            --name artifact-server-ci \
            --use
          docker buildx inspect --bootstrap

      - name: Run the iteration gate
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm verify:iteration
