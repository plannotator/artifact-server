      behavior: {id: GATE-002-B, description: Install through every supported network and proxy pattern and verify unique version hosts, TLS, redirects, cookies, links, and hostile host handling.}
      failure: {id: GATE-002-F, description: A deployment with unresolved DNS, certificate, proxy, hostname, cookie, or browser compatibility cannot be declared supported.}
    deployments: *all
    status: specified
    depends_on: [DEP-014]
    evidence: []

  - id: GATE-003
    kind: release_gate
    behavior: The hosted service begins with one D1 database only after load and failure tests, and chooses a tested installation-directory rollout or external Postgres control plane before a second database is required.
    owner: database-adapters
    source: {file: artifact-server-product-spec.html, anchor: decisions}
    acceptance:
      behavior: {id: GATE-003-B, description: Measure D1 latency, contention, growth, backup, restore, and failure limits and record the threshold and tested second-database design.}
      failure: {id: GATE-003-F, description: Adding bindings, accepting a request-supplied installation ID, or manually moving data cannot be presented as automatic sharding or a supported control plane.}
    deployments: *hosted
    status: specified
    depends_on: [DEP-013]
    evidence: []

  - id: GATE-004
    kind: release_gate
    behavior: Cloudflare Artifacts remains optional until access, price, repository limits, Git compatibility, failure behavior, and recovery are verified.
    owner: git-history
    source: {file: artifact-server-product-spec.html, anchor: decisions}
    acceptance:
      behavior: {id: GATE-004-B, description: Complete the Cloudflare Artifacts provider probe and document its supported limits and fallback behavior.}
      failure: {id: GATE-004-F, description: Closed-beta access, unavailable pricing, a repository-size limit, missing Git behavior, or provider outage cannot block saved versions or core comparison.}
    deployments: *hosted
    status: specified
    depends_on: [GIT-007]
    evidence: []

  - id: GATE-005
    kind: release_gate
    behavior: Hosted WorkOS MCP authorization ships only after live consent, token lifetime, refresh rotation, revocation, claims, audience, scope, CIMD, DCR, callback, and stale-client probes pass.
    owner: mcp
    source: {file: artifact-server-product-spec.html, anchor: decisions}
    acceptance:
      behavior: {id: GATE-005-B, description: Run fresh and stale-state browser authorization, refresh, revoke, disconnect, and reconnect tests in Codex, Claude Code, claude.ai where reachable, and compatibility clients.}
      failure: {id: GATE-005-F, description: Wrong issuer, audience, scope, callback, PKCE, registration, revoked grant, stale token, or cross-tenant object access cannot authorize an MCP tool.}
    deployments: *hosted
    status: specified
    depends_on: [MCP-010, MCP-011, MCP-012]
    evidence: []

  - id: GATE-006
    kind: release_gate
    behavior: Embedded Better Auth MCP OAuth is not supported until its beta path passes interoperability, security, migration, durable-state, refresh, revoke, recovery, CIMD, and DCR tests.
    owner: mcp
    source: {file: artifact-server-product-spec.html, anchor: decisions}
    acceptance:
      behavior: {id: GATE-006-B, description: Run the complete hosted OAuth matrix against the embedded provider and document operational ownership and upgrade behavior.}
      failure: {id: GATE-006-F, description: Beta incompatibility, lost client or consent state, weak audience binding, refresh replay, failed migration, or missing revocation keeps the option disabled.}
    deployments: *external_storage
    status: specified
    depends_on: [MCP-014]
    evidence: []

  - id: GATE-007
    kind: release_gate
    behavior: AWS, GCP, and Azure remain unsupported until their installers independently pass create, upgrade, rollback, state recovery, backup, restore, private-network, managed-Kubernetes, and delete tests.
    owner: deployment
    source: {file: artifact-server-product-spec.html, anchor: decisions}
    acceptance:
      behavior: {id: GATE-007-B, description: Publish a complete signed evidence run for the full lifecycle on each cloud and each advertised runtime variant.}
      failure: {id: GATE-007-F, description: Documentation, code generation, success on another cloud, or a create-only smoke test cannot qualify a deployment as supported.}
    deployments: *major_clouds
    status: specified
    depends_on: [DEP-008, DEP-009, DEP-010]
    evidence: []

  - id: GATE-008
    kind: release_gate
    behavior: Public artifactserver.com links do not launch until abuse, executable-file, malware, phishing, copyright, reputation, suspension, and deletion policy is both decided and exercised.
    owner: hosted-policy
    source: {file: artifact-server-product-spec.html, anchor: decisions}
    acceptance:
      behavior: {id: GATE-008-B, description: Complete policy approval and operational exercises for every public-hosting abuse path with named owners and response evidence.}
      failure: {id: GATE-008-F, description: A public-link launch is blocked when any report, containment, deletion, appeal, or domain-reputation path has no working owner or control.}
    deployments: *hosted
    status: specified
    depends_on: [HOST-002]
    evidence: []

  - id: GATE-009
    kind: release_gate
    behavior: Default and maximum file count, file size, artifact size, version count, text-diff size, rate, retention, and egress limits come from measured tests and published cost envelopes.
    owner: hosted-policy
    source: {file: artifact-server-product-spec.html, anchor: decisions}
    acceptance:
      behavior: {id: GATE-009-B, description: Benchmark representative and hostile workloads on every target, choose limits, and record their cost, latency, memory, storage, and retry effects.}
      failure: {id: GATE-009-F, description: An unmeasured or unenforced limit cannot be presented as a supported capacity or used to predict hosting cost.}
    deployments: *all
    status: specified
    depends_on: [PUB-008, DIF-003]
    evidence: []

  - id: GATE-010
    kind: release_gate
    behavior: Availability, backup frequency, restore-time target, acceptable data-loss window, and support tiers must be explicit and proven before team and hosted reliability promises are published.
    owner: operations
    source: {file: artifact-server-product-spec.html, anchor: decisions}
    acceptance:
      behavior: {id: GATE-010-B, description: Exercise dependency failure, backup, point-in-time recovery, region or node loss, and operator response against each proposed reliability target.}
      failure: {id: GATE-010-F, description: A recovery or availability promise cannot exceed measured end-to-end evidence or omit database, blob, DNS, identity, and integration dependencies.}
    deployments: *external_storage
    status: specified
    depends_on: [OPS-003, OPS-005]
    evidence: []

  - id: GATE-011
    kind: release_gate
    behavior: Encryption-key control, regional placement, audit export, legal hold, and permanent deletion are decided and verified before selling the corresponding regulated-team claim.
    owner: hosted-policy
    source: {file: artifact-server-product-spec.html, anchor: decisions}
    acceptance:
      behavior: {id: GATE-011-B, description: Trace each enterprise control through configuration, enforcement, storage, backup, export, deletion, monitoring, and customer-visible evidence.}
      failure: {id: GATE-011-F, description: Backups, replicas, CDN copies, Git history, logs, or integration references cannot be omitted from a claimed regional, hold, encryption, export, or deletion boundary.}
    deployments: *external_storage
    status: specified
    depends_on: [OPS-003, GIT-001, AUD-001]
    evidence: []

  - id: GATE-012
    kind: release_gate
    behavior: Customer-owned content domains remain unsupported until certificate issuance, cookie scope, unique-version origins, abuse response, CDN behavior, revocation, and domain removal are designed and tested.
    owner: content-delivery
    source: {file: artifact-server-product-spec.html, anchor: decisions}
    acceptance:
      behavior: {id: GATE-012-B, description: Prove the complete domain lifecycle and browser security model without weakening application and version origin isolation.}
      failure: {id: GATE-012-F, description: Domain takeover, stale certificate, unsafe cookie scope, shared version origin, broken purge, or unresolved abuse ownership keeps custom domains disabled.}
    deployments: *external_storage
    status: specified
    depends_on: [CNT-003, DEP-014]
    evidence: []

  - id: GATE-013
    kind: release_gate
    behavior: The Plannotator review bridge must pass hostile-artifact, strict policy, multi-page, single-page, service-worker, anchor, expiry, and browser compatibility tests or be replaced by the browser-extension fallback.
    owner: plannotator-integration
    source: {file: artifact-server-product-spec.html, anchor: decisions}
    acceptance:
      behavior: {id: GATE-013-B, description: Run the review security and compatibility matrix and record the supported bridge or extension decision.}
      failure: {id: GATE-013-F, description: Any reusable credential exposure, stored-byte mutation, origin confusion, service-worker control, anchor corruption, or unsupported-browser silent failure blocks that review surface.}
    deployments: *plannotator_capable
    status: specified
    depends_on: [PLN-009, PLN-010, PLN-016]
    evidence: []

  - id: GATE-014
    kind: release_gate
    behavior: Existing standalone artifact attachment to Plannotator remains unavailable until move-or-copy semantics, permissions, IDs, links, rollback, retry, and disconnect behavior are decided and tested.
    owner: plannotator-integration
    source: {file: artifact-server-product-spec.html, anchor: decisions}
    acceptance:
      behavior: {id: GATE-014-B, description: Record the chosen semantics and pass authorization, identity, failure, recovery, and disconnect tests for an explicit attachment.}
      failure: {id: GATE-014-F, description: Pairing alone, a failed action, retry, or disconnect cannot silently move, copy, expose, duplicate, or orphan existing artifacts.}
    deployments: *plannotator_capable
    status: specified
    depends_on: [PLN-013]
    evidence: []

  - id: GATE-015
    kind: release_gate
    behavior: One-click private Plannotator connection is advertised only after one route is selected and its health, upgrade, replica, egress, reachability, scope, and failure behavior pass tests.
    owner: plannotator-integration
    source: {file: artifact-server-product-spec.html, anchor: decisions}
    acceptance:
      behavior: {id: GATE-015-B, description: Qualify customer networking, Cloudflare Tunnel, or the product connector with a published install-to-recovery test matrix.}
      failure: {id: GATE-015-F, description: A route that exposes another service, grants inbound general network access, hides failure, loses pairing state, or lacks support ownership cannot be called one-click.}
    deployments: *plannotator_capable
    status: specified
    depends_on: [PLN-014, PLN-015]
    evidence: []
