services:
  artifact-server:
    container_name: !reset null
    command:
      - start-external-storage
      - --host
      - 0.0.0.0
      - --port
      - "8787"
    environment:
      - ARTIFACT_SERVER_API_TOKEN_FILE=/run/secrets/artifact-server-api-token
      - ARTIFACT_SERVER_BOOTSTRAP_ADMIN_EMAIL=${ARTIFACT_SERVER_BOOTSTRAP_ADMIN_EMAIL:?Set ARTIFACT_SERVER_BOOTSTRAP_ADMIN_EMAIL}
      - ARTIFACT_SERVER_CONTENT_DOMAIN=${ARTIFACT_SERVER_CONTENT_DOMAIN:?Set ARTIFACT_SERVER_CONTENT_DOMAIN}
      - ARTIFACT_SERVER_DATABASE_URL_FILE=/run/secrets/artifact-server-database-url
      - ARTIFACT_SERVER_INSTALLATION_ID=${ARTIFACT_SERVER_INSTALLATION_ID:?Set ARTIFACT_SERVER_INSTALLATION_ID}
      - ARTIFACT_SERVER_ORIGIN=${ARTIFACT_SERVER_ORIGIN:?Set ARTIFACT_SERVER_ORIGIN}
      - ARTIFACT_SERVER_READINESS_WITHDRAWAL_MS=${ARTIFACT_SERVER_READINESS_WITHDRAWAL_MS:-1000}
      - ARTIFACT_SERVER_REQUEST_LOG_SAMPLE_RATE=${ARTIFACT_SERVER_REQUEST_LOG_SAMPLE_RATE:-0.01}
      - ARTIFACT_SERVER_S3_BUCKET=${ARTIFACT_SERVER_S3_BUCKET:?Set ARTIFACT_SERVER_S3_BUCKET}
      - ARTIFACT_SERVER_S3_ENDPOINT
      - ARTIFACT_SERVER_S3_FORCE_PATH_STYLE=${ARTIFACT_SERVER_S3_FORCE_PATH_STYLE:-false}
      - ARTIFACT_SERVER_S3_REGION=${ARTIFACT_SERVER_S3_REGION:?Set ARTIFACT_SERVER_S3_REGION}
      - ARTIFACT_SERVER_SHUTDOWN_DEADLINE_MS=${ARTIFACT_SERVER_SHUTDOWN_DEADLINE_MS:-10000}
      - ARTIFACT_SERVER_WORKOS_API_KEY_FILE
      - ARTIFACT_SERVER_WORKOS_CLIENT_ID
    expose:
      - "8787"
    ports: !reset []
    volumes: !reset []
    secrets:
      - artifact-server-api-token
      - artifact-server-database-url

secrets:
  artifact-server-api-token:
    file: ${ARTIFACT_SERVER_API_TOKEN_SECRET_FILE:?Set ARTIFACT_SERVER_API_TOKEN_SECRET_FILE}
  artifact-server-database-url:
    file: ${ARTIFACT_SERVER_DATABASE_URL_SECRET_FILE:?Set ARTIFACT_SERVER_DATABASE_URL_SECRET_FILE}
