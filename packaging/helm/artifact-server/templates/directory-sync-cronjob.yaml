{{- include "artifact-server.validation" . -}}
{{- if (include "artifact-server.directorySyncEnabled" .) }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "artifact-server.fullname" . }}-sync-directory
  labels:
    {{- include "artifact-server.labels" . | nindent 4 }}
    app.kubernetes.io/component: directory-sync
spec:
  schedule: {{ .Values.directorySync.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: {{ .Values.directorySync.activeDeadlineSeconds }}
      backoffLimit: {{ .Values.directorySync.backoffLimit }}
      template:
        metadata:
          labels:
            {{- include "artifact-server.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: directory-sync
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "artifact-server.serviceAccountName" . }}
          automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
          enableServiceLinks: false
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: sync-directory
              image: {{ include "artifact-server.image" . | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              args:
                - maintenance
                - sync-directory
                - --once
                - --mode
                - external-storage
              env:
                {{- include "artifact-server.runtimeEnvironment" . | nindent 16 }}
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              volumeMounts:
                - name: runtime-secrets
                  mountPath: /run/secrets/artifact-server
                  readOnly: true
                - name: temporary
                  mountPath: /tmp
          volumes:
            - name: runtime-secrets
              secret:
                secretName: {{ .Values.secret.name | quote }}
                defaultMode: 288
                items:
                  {{- include "artifact-server.secretItems" . | nindent 18 }}
            - name: temporary
              emptyDir:
                medium: Memory
                sizeLimit: 64Mi
{{- end }}
