<svg xmlns="http://www.w3.org/2000/svg" width="268" height="84" viewBox="0 0 268 84" role="img" aria-labelledby="title description">
  <title id="title">First-class Pi support</title>
  <desc id="description">The Artifact Server Pi extension sends review comments to a live Pi session. Pi replies to and resolves the comments in Artifact Server.</desc>

  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e0f19"/>
      <stop offset="1" stop-color="#07080d"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="267" height="83" rx="12" fill="url(#frame)" stroke="#232637"/>

  <g transform="translate(14 13) scale(.072)" fill="#f5f6f8" aria-hidden="true">
    <path fill-rule="evenodd" d="M165.29 165.29H517.36V400H400V517.36H282.65V634.72H165.29ZM282.65 282.65V400H400V282.65Z"/>
    <path d="M517.36 400H634.72V634.72H517.36Z"/>
  </g>

  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="70" y="33" fill="#8f96ab" font-size="8.5" font-weight="600" letter-spacing="1.6">PI EXTENSION</text>
    <text x="70" y="55" fill="#f5f6f8" font-size="13" font-weight="500" letter-spacing="-0.2">Live integrated feedback</text>
  </g>

  <g transform="translate(239 20)" fill="none" stroke="#8286ff" stroke-linecap="square" stroke-linejoin="miter" stroke-width="1.75" aria-hidden="true">
    <path d="M0 0H11"/>
    <path d="m7-4 4 4-4 4"/>
  </g>
</svg>
