<svg xmlns="http://www.w3.org/2000/svg" width="260" height="96" viewBox="0 0 260 96" role="img" aria-labelledby="title description">
  <title id="title">OpenCode plugin contributions welcome</title>
  <desc id="description">The OpenCode bridge is not release-qualified. Live-host verification, feature work, and pull requests are welcome.</desc>

  <rect x="1" y="1" width="258" height="94" rx="14" fill="#262838" stroke="#6b6e80" stroke-width="1.5" stroke-dasharray="6 6"/>

  <g id="opencode-mark" transform="translate(18 27) scale(.14)" aria-hidden="true">
    <path d="M180 240H60V120H180V240Z" fill="#555a70"/>
    <path d="M180 60H60V240H180V60ZM240 300H0V0H240V300Z" fill="#8f96ab"/>
  </g>

  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="66" y="37" fill="#8f96ab" font-size="8.5" font-weight="600" letter-spacing="1.3">OPENCODE PLUGIN</text>
    <text x="66" y="61" fill="#8f96ab" font-size="12.5" font-weight="500" letter-spacing="-.2">Feature or PR welcome</text>
  </g>

  <g transform="translate(237 23)" fill="none" stroke="#8f96ab" stroke-linecap="square" stroke-width="1.75" aria-hidden="true">
    <path d="M0-5V5M-5 0H5"/>
  </g>
</svg>
