<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">First-class Pi support</title>
  <desc id="description">Artifact Server sends review comments to a live Pi session. Replies return to Artifact Server.</desc>

  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e0f19"/>
      <stop offset="1" stop-color="#07080d"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#ground)"/>

  <g transform="translate(41.2 41.2) scale(.235)" fill="#f5f6f8" aria-hidden="true">
    <path fill-rule="evenodd" d="M165.29 165.29H517.36V400H400V517.36H282.65V634.72H165.29ZM282.65 282.65V400H400V282.65Z"/>
    <path d="M517.36 400H634.72V634.72H517.36Z"/>
  </g>

  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="80" y="300" fill="#8f96ab" font-size="18" font-weight="600" letter-spacing="4.5">FIRST-CLASS PI SUPPORT</text>
    <text x="80" y="360" fill="#f5f6f8" font-size="52" font-weight="600" letter-spacing="-0.8">Live integrated feedback</text>
    <text x="80" y="414" fill="#8f96ab" font-size="23" font-weight="400">Send review comments to a live Pi session.</text>
    <text x="80" y="448" fill="#8f96ab" font-size="23" font-weight="400">Replies return to Artifact Server.</text>

    <g transform="translate(80 566) scale(.5)" aria-hidden="true">
      <rect x="0" y="32" width="26" height="26" rx="7" fill="#6d6eff"/>
      <circle cx="39" cy="10" r="10" fill="#adb2ff"/>
      <path d="M34 58 48 32 62 58Z" fill="#f7f5ff"/>
    </g>
    <text x="122" y="589" fill="#8f96ab" font-size="20" font-weight="500">Artifact Server</text>
  </g>
</svg>
