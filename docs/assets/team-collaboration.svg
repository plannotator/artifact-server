<svg xmlns="http://www.w3.org/2000/svg" width="600" height="220" viewBox="0 0 600 220" role="img" aria-labelledby="title description">
  <title id="title">Teams review artifacts together</title>
  <desc id="description">Ada Lovelace and Sam Kim leave distinct comments on the same artifact version, and Codex confirms the update.</desc>

  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e0f19"/>
      <stop offset="1" stop-color="#07080d"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="598" height="218" rx="18" fill="url(#frame)" stroke="#232637" stroke-width="1.5"/>

  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="36" y="32" fill="#8f96ab" font-size="12" font-weight="600" letter-spacing="2.4">TEAM COLLABORATION</text>

    <g transform="translate(36 51)">
      <rect width="238" height="144" rx="10" fill="#12131d" stroke="#303345" stroke-width="1.5"/>
      <path d="M0 29h238" stroke="#303345" stroke-width="1.5"/>
      <circle cx="17" cy="15" r="3" fill="#6d6eff"/>
      <text x="29" y="20" fill="#f5f6f8" font-size="11" font-weight="600">artifact.html</text>
      <path d="M18 51h128M18 66h166M18 81h148" stroke="#555a70" stroke-width="5" stroke-linecap="round"/>
      <rect x="14" y="99" width="190" height="19" rx="3" fill="#202139" stroke="#8286ff" stroke-width="1.5"/>
      <path d="M22 108.5h132" stroke="#adb2ff" stroke-width="4" stroke-linecap="round"/>
      <circle cx="207" cy="108.5" r="13" fill="#6d6eff"/>
      <text x="207" y="113" fill="#f5f6f8" font-size="12" font-weight="700" text-anchor="middle">1</text>
    </g>

    <g fill="none" stroke="#8286ff" stroke-linecap="square" stroke-linejoin="miter" stroke-width="2" aria-hidden="true">
      <path d="M282 124h22"/>
      <path d="m297 117 7 7-7 7"/>
    </g>

    <g transform="translate(316 51)">
      <rect width="248" height="144" rx="10" fill="#12131d" stroke="#303345" stroke-width="1.5"/>
      <text x="16" y="19" fill="#f5f6f8" font-size="11" font-weight="600">Comments</text>
      <rect x="213" y="7" width="19" height="18" rx="3" fill="#202139"/>
      <text x="222.5" y="20" fill="#adb2ff" font-size="11" font-weight="700" text-anchor="middle">3</text>
      <path d="M0 28h248M0 66h248M0 104h248" stroke="#303345" stroke-width="1.5"/>

      <circle cx="20" cy="47" r="9" fill="#202139"/>
      <text x="20" y="50" fill="#ff7a59" font-size="7" font-weight="700" text-anchor="middle">AL</text>
      <text x="40" y="42" fill="#ff7a59" font-size="9" font-weight="700">Ada Lovelace</text>
      <text x="40" y="57" fill="#f5f6f8" font-size="9" font-weight="600">Tighten the hierarchy.</text>

      <circle cx="20" cy="85" r="9" fill="#202139"/>
      <text x="20" y="88" fill="#2dd4bf" font-size="7" font-weight="700" text-anchor="middle">SK</text>
      <text x="40" y="80" fill="#2dd4bf" font-size="9" font-weight="700">Sam Kim</text>
      <text x="40" y="95" fill="#f5f6f8" font-size="9" font-weight="600">Keep the updated diagram.</text>

